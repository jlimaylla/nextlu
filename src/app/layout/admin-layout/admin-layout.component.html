<mat-sidenav-container class="h-screen">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="w-64"
  >
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col">
    <app-header (menuClick)="sidenav.toggle()" />
    <main class="flex-1 overflow-auto p-4 md:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
