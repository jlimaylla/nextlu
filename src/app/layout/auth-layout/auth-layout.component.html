<div class="auth-shell">

  <!-- Theme toggle -->
  <div class="absolute top-5 right-5 z-20">
    <app-theme-toggle />
  </div>

  <!-- ── Panel izquierdo: branding (solo pantallas grandes) ── -->
  <aside class="brand-panel hidden lg:flex w-5/12 xl:w-1/2 flex-col relative overflow-hidden">

    <!-- Decoraciones de fondo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <!-- Contenido -->
    <div class="relative z-10 flex flex-col h-full px-12 py-10 justify-between">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="logo-box">
          <mat-icon class="!text-3xl text-white">school</mat-icon>
        </div>
        <span class="text-xl font-bold text-white tracking-wide">Nextlu Platform</span>
      </div>

      <!-- Mensaje central -->
      <div>
        <h2 class="text-4xl xl:text-5xl font-bold text-white leading-tight mb-5">
          Capacita a tu equipo.<br />
          <span class="text-blue-200">Mide el impacto.</span>
        </h2>
        <p class="text-blue-100 text-base mb-10 leading-relaxed max-w-sm">
          Plataforma integral para gestionar capacitaciones corporativas y
          evaluaciones.
        </p>

        <!-- Features -->
        <!-- <div class="flex flex-col gap-5">
          @for (feature of features; track feature.icon) {
            <div class="flex items-start gap-4">
              <div class="feature-icon-box flex-shrink-0">
                <mat-icon class="!text-xl text-blue-200">{{ feature.icon }}</mat-icon>
              </div>
              <div>
                <p class="text-white font-semibold text-sm leading-tight">{{ feature.title }}</p>
                <p class="text-blue-200 text-xs mt-0.5 leading-relaxed">{{ feature.desc }}</p>
              </div>
            </div>
          }
        </div> -->
      </div>

      <!-- Footer -->
      <p class="text-blue-300 text-xs">
        © 2026 Nextlu Platform
      </p>
    </div>
  </aside>

  <!-- ── Panel derecho: formulario ── -->
  <main class="form-panel flex-1 flex flex-col items-center justify-center p-6 md:p-12 bg-white dark:bg-gray-950">

    <!-- Logo mobile (solo visible cuando el panel izquierdo está oculto) -->
    <div class="flex lg:hidden items-center gap-2 mb-10">
      <mat-icon class="!text-3xl text-primary-700 dark:text-primary-400">school</mat-icon>
      <span class="text-xl font-bold text-gray-900 dark:text-white tracking-tight">Nextlu Platform</span>
    </div>

    <div class="w-full max-w-sm">
      <router-outlet />
    </div>
  </main>

</div>
