<app-page-header title="Usuarios" subtitle="Gestión de usuarios">
  <a mat-flat-button color="primary" routerLink="new">
    <mat-icon>person_add</mat-icon> Nuevo usuario
  </a>
</app-page-header>

<mat-form-field appearance="outline" subscriptSizing="dynamic" class="max-w-sm mb-4 block">
  <mat-icon matPrefix class="!text-lg opacity-60">search</mat-icon>
  <input
    matInput
    placeholder="Buscar por nombre o correo..."
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
  />
</mat-form-field>

@if (filteredUsers().length === 0) {
  <div
    class="flex flex-col items-center justify-center gap-2 py-16 text-center
           rounded-2xl border border-dashed border-[var(--mat-sys-outline-variant)]"
  >
    <mat-icon class="!text-4xl !w-10 !h-10 text-[var(--mat-sys-on-surface-variant)]">
      group
    </mat-icon>
    <p class="text-sm text-[var(--mat-sys-on-surface-variant)]">
      No hay usuarios que coincidan con la búsqueda.
    </p>
  </div>
} @else {
  <div class="overflow-x-auto rounded-2xl border border-[var(--mat-sys-outline-variant)]">
    <table mat-table [dataSource]="filteredUsers()" class="w-full">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let u">
          <p class="font-medium text-[var(--mat-sys-on-surface)]">{{ u.displayName }}</p>
          <p class="text-xs text-[var(--mat-sys-on-surface-variant)]">{{ u.email }}</p>
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let u">{{ roleLabel(u.role) }}</td>
      </ng-container>

      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Área / Cargo / Sede</th>
        <td mat-cell *matCellDef="let u" class="text-[var(--mat-sys-on-surface-variant)]">
          {{ details(u) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let u">
          <app-status-badge
            [label]="u.status === 'ACTIVE' ? 'Activo' : 'Bloqueado'"
            [variant]="u.status === 'ACTIVE' ? 'success' : 'error'"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let u" class="text-right">
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones del usuario">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <a mat-menu-item [routerLink]="[u.id, 'edit']">
              <mat-icon>edit</mat-icon><span>Editar</span>
            </a>
            <button mat-menu-item (click)="toggleStatus(u)">
              <mat-icon>{{ u.status === 'ACTIVE' ? 'block' : 'lock_open' }}</mat-icon>
              <span>{{ u.status === 'ACTIVE' ? 'Bloquear' : 'Desbloquear' }}</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
}
